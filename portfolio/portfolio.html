<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>马思琪 · 个人作品集</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/npm/inter-ui@3.19.3/inter.css" rel="stylesheet">
<style>
  /* ========== Figma 设计令牌 ========== */
  :root {
    --font: 'Inter', 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
    --bg: #ffffff;
    --surface: #ffffff;
    --header-bg: #e6f3fc;
    --footer-bg: #e6f3fc;
    --title: #18324b;
    --primary: #2377b9;
    --text: #587087;
    --muted: #8ca0b2;
    --success: #15866b;
    --priority-bg: #edf7fe;
    --priority-text: #2377b9;
    --keyword-bg: #eaf8f3;
    --keyword-text: #15866b;
    --toggle-bg: #f1f5f8;
    --line: #dbe8f0;
    --marker-bg: #edf7fe;
    --shadow: 0 4px 24px rgba(24, 50, 75, 0.06);
    --shadow-sm: 0 2px 8px rgba(24, 50, 75, 0.05);
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ========== 头部个人信息 ========== */
  .site-header {
    background: var(--header-bg);
    padding: 56px 24px 48px;
  }
  .header-inner {
    max-width: 1200px; margin: 0 auto;
    display: flex; gap: 40px; align-items: flex-start; flex-wrap: wrap;
  }
  .avatar {
    width: 132px; height: 132px; border-radius: 50%;
    background: #fff; overflow: hidden; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 44px; color: var(--title);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .header-content { flex: 1; min-width: 260px; }
  .name { font-size: 40px; font-weight: 700; color: var(--title); letter-spacing: -0.5px; }
  .job { font-size: 18px; color: var(--primary); margin-top: 4px; font-weight: 500; }
  .info-row {
    display: flex; flex-wrap: wrap; gap: 20px;
    margin-top: 18px; font-size: 15px; color: var(--text);
  }
  .info-item { display: flex; align-items: center; gap: 8px; }
  .info-item svg { width: 16px; height: 16px; color: var(--primary); opacity: .8; }
  .intro {
    max-width: 1028px; margin-top: 16px;
    font-size: 15px; color: var(--text); line-height: 1.7;
  }
  .honors {
    margin-top: 14px;
    display: flex; flex-wrap: wrap; gap: 10px;
  }
  .honor-tag {
    display: inline-flex; align-items: center;
    padding: 5px 12px; border-radius: 6px;
    background: #fff; color: var(--primary);
    font-size: 13px; font-weight: 500;
    box-shadow: 0 1px 4px rgba(24,50,75,.05);
  }

  /* ========== 专业技能 ========== */
  .skills-section { margin-bottom: 48px; }
  .skills-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;
  }
  .skill-card {
    background: var(--surface); border-radius: var(--radius-md);
    box-shadow: var(--shadow); padding: 20px 24px;
    display: flex; align-items: flex-start; gap: 14px;
  }
  .skill-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--primary); margin-top: 8px; flex-shrink: 0;
  }
  .skill-text { font-size: 15px; color: var(--text); line-height: 1.7; }

  /* ========== 主体 ========== */
  main { max-width: 1200px; margin: 0 auto; padding: 48px 24px 80px; }

  /* 章节标题 + 维度切换 */
  .section-head {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 20px; margin-bottom: 32px; flex-wrap: wrap;
  }
  .section-title h2 {
    font-size: 28px; font-weight: 700; color: var(--title);
  }
  .section-title p {
    font-size: 15px; color: var(--muted); margin-top: 4px;
  }

  .dim-toggle {
    display: inline-flex; align-items: center;
    background: var(--toggle-bg); border-radius: 999px;
    padding: 4px; gap: 2px;
  }
  .dim-toggle button {
    border: none; background: transparent; cursor: pointer;
    padding: 8px 22px; border-radius: 999px;
    font-size: 14px; font-weight: 500; color: var(--muted);
    transition: all .2s ease; font-family: inherit;
  }
  .dim-toggle button.active {
    background: #fff; color: var(--primary);
    box-shadow: var(--shadow-sm);
  }

  /* ========== 时间轴 ========== */
  .timeline { display: flex; flex-direction: column; }
  .tl-item { display: flex; gap: 20px; }
  .tl-left {
    width: 32px; flex-shrink: 0;
    display: flex; justify-content: center;
    position: relative;
  }
  .tl-marker {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--marker-bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 1;
  }
  .tl-marker::after {
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: var(--primary);
  }
  .tl-line {
    position: absolute; top: 24px; bottom: 0; left: 50%;
    width: 1px; background: var(--line);
    transform: translateX(-50%);
  }
  .tl-item:last-child .tl-line { display: none; }
  .tl-right { flex: 1; padding-bottom: 28px; }
  .tl-time {
    font-size: 14px; color: var(--primary); font-weight: 500;
    margin-bottom: 8px;
  }

  /* ========== 项目维度：与公司维度一致的浅色时间线 ========== */
  .project-timeline .tl-item:last-child .tl-right { padding-bottom: 0; }
  .project-timeline .tl-item.last-in-group .tl-line { display: none; }
  .project-timeline .company-gap { height: 28px; }

  /* ========== 公司维度：公司信息 ========== */
  .company-info { margin-bottom: 16px; }
  .company-head {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 12px; flex-wrap: wrap;
  }
  .company-name { font-size: 20px; font-weight: 700; color: var(--title); }
  .company-time { font-size: 14px; color: var(--primary); font-weight: 500; }
  .company-pos { font-size: 15px; color: var(--text); margin-top: 8px; }
  .company-work { font-size: 15px; color: var(--text); margin-top: 8px; line-height: 1.7; }
  .company-projects { margin-top: 20px; }

  /* ========== 项目卡片 ========== */
  .project-card {
    background: var(--surface); border-radius: var(--radius-md);
    box-shadow: var(--shadow);
    padding: 24px;
    transition: box-shadow .2s ease;
  }
  .project-card + .project-card { margin-top: 16px; }
  .project-head { cursor: pointer; user-select: none; }
  .project-summary {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 16px; flex-wrap: wrap;
  }
  .project-title-row {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .p-name { font-size: 18px; font-weight: 700; color: var(--title); }
  .tag {
    display: inline-flex; align-items: center;
    padding: 4px 12px; border-radius: 6px;
    font-size: 13px; font-weight: 600;
  }
  .tag-priority { background: var(--priority-bg); color: var(--priority-text); }
  .tag-keyword { background: var(--keyword-bg); color: var(--keyword-text); }
  .p-role {
    font-size: 14px; color: var(--muted); margin-top: 6px;
  }
  .p-meta-right {
    display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  }
  .p-keywords { display: flex; gap: 8px; flex-wrap: wrap; }
  .p-chevron {
    width: 24px; height: 24px; color: var(--muted);
    transition: transform .25s ease; flex-shrink: 0;
  }
  .project-card.open .p-chevron { transform: rotate(180deg); }

  .project-body {
    max-height: 0; overflow: hidden; transition: max-height .35s ease;
  }
  .project-card.open .project-body { max-height: 700px; }
  .project-body-inner {
    padding-top: 20px; margin-top: 20px;
    border-top: 1px solid var(--line);
    display: flex; gap: 24px; flex-wrap: wrap;
  }
  .p-fields { flex: 1; min-width: 260px; display: grid; gap: 14px; }
  .field { display: grid; gap: 6px; }
  .field-label {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 600; color: var(--title);
  }
  .field-label::before {
    content: ""; width: 3px; height: 14px; border-radius: 2px;
    background: var(--primary);
  }
  .field-value { font-size: 15px; color: var(--text); line-height: 1.7; padding-left: 11px; }
  .field-value.result { color: var(--success); font-weight: 500; }
  .p-thumb {
    width: 310px; height: 196px; border-radius: var(--radius-sm);
    background: var(--priority-bg);
    display: flex; align-items: center; justify-content: center;
    color: var(--primary); font-size: 13px; flex-shrink: 0;
    overflow: hidden; position: relative; cursor: pointer;
  }
  .p-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .p-thumb-count {
    position: absolute; bottom: 10px; right: 10px;
    background: rgba(24, 50, 75, 0.75); color: #fff;
    padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 500;
  }
  .p-link {
    display: inline-flex; align-items: center; gap: 4px;
    margin-top: 6px; font-size: 14px; color: var(--primary);
    text-decoration: none; font-weight: 500;
  }
  .p-link:hover { text-decoration: underline; }

  /* ========== 图片灯箱 ========== */
  .lightbox-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(24, 50, 75, 0.92);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .lightbox-overlay.active { opacity: 1; pointer-events: auto; }
  .lightbox-wrap { position: relative; max-width: 90vw; max-height: 90vh; }
  .lightbox-wrap img { max-width: 100%; max-height: 86vh; border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  .lightbox-close, .lightbox-prev, .lightbox-next {
    position: absolute; background: rgba(255,255,255,.15); border: none;
    color: #fff; cursor: pointer; border-radius: 50%;
    width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    transition: background .2s;
  }
  .lightbox-close:hover, .lightbox-prev:hover, .lightbox-next:hover { background: rgba(255,255,255,.3); }
  .lightbox-close { top: -52px; right: 0; }
  .lightbox-prev { left: -60px; top: 50%; transform: translateY(-50%); }
  .lightbox-next { right: -60px; top: 50%; transform: translateY(-50%); }
  .lightbox-counter { position: absolute; bottom: -36px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 14px; }

  /* ========== 页脚 ========== */
  .site-footer {
    background: var(--footer-bg); padding: 30px 24px;
  }
  .footer-inner {
    max-width: 1200px; margin: 0 auto;
    display: flex; justify-content: space-between; align-items: center;
    gap: 20px; flex-wrap: wrap;
    font-size: 14px; color: var(--text);
  }

  /* ========== 响应式 ========== */
  @media (max-width: 768px) {
    .header-inner { flex-direction: column; align-items: center; text-align: center; }
    .info-row { justify-content: center; }
    .intro { text-align: left; }
    .section-head { flex-direction: column; align-items: flex-start; }
    .project-summary { flex-direction: column; }
    .p-meta-right { width: 100%; justify-content: space-between; }
    .p-thumb { width: 100%; }
    .footer-inner { flex-direction: column; text-align: center; }
    .lightbox-prev { left: 10px; }
    .lightbox-next { right: 10px; }
    .lightbox-close { top: 10px; right: 10px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="avatar" id="avatar">马</div>
    <div class="header-content">
      <h1 class="name" id="p-name">马思琪</h1>
      <div class="job" id="p-job">AIGC 产品经理 / AI 项目经理</div>
      <div class="info-row">
        <div class="info-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5"/></svg>
          <span id="p-school">浙江大学 · 工业设计（待填写）</span>
        </div>
        <div class="info-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><path d="M12 18h.01"/></svg>
          <span id="p-phone">138-XXXX-XXXX</span>
        </div>
        <div class="info-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <span id="p-email">your@email.com</span>
        </div>
      </div>
      <p class="intro" id="p-intro"></p>
      <div class="honors" id="p-honors"></div>
    </div>
  </div>
</header>

<main>
  <section class="skills-section" id="skills-section">
    <div class="section-head">
      <div class="section-title"><h2>专业技能</h2></div>
    </div>
    <div class="skills-grid" id="skills-grid"></div>
  </section>

  <div class="section-head">
    <div class="section-title">
      <h2>项目介绍</h2>
      <p id="section-desc">按任职公司回顾工作脉络与代表项目</p>
    </div>
    <div class="dim-toggle">
      <button id="tab-company" class="active" onclick="switchDim('company')">公司维度</button>
      <button id="tab-project" onclick="switchDim('project')">项目维度</button>
    </div>
  </div>

  <div id="view-company"></div>
  <div id="view-project" style="display:none"></div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <span>© 2026 马思琪 · 个人作品集</span>
    <span>感谢浏览 · 期待与你一起创造有价值的产品</span>
  </div>
</footer>

<div class="lightbox-overlay" id="lightbox" onclick="closeLightbox(event)">
  <div class="lightbox-wrap" onclick="event.stopPropagation()">
    <button class="lightbox-close" onclick="closeLightbox()" aria-label="关闭">✕</button>
    <button class="lightbox-prev" onclick="prevImage()" aria-label="上一张">‹</button>
    <img id="lightbox-img" src="" alt="">
    <button class="lightbox-next" onclick="nextImage()" aria-label="下一张">›</button>
    <div class="lightbox-counter" id="lightbox-counter"></div>
  </div>
</div>

<script>
/* ==========================================================
 * 数据层：从 portfolio_data.txt 读取 JSON 并渲染
 * 字段与后端数据库一一对应（见 database_schema.sql）
 * person / company / project / company_project 四表结构
 * ========================================================== */
let DATA = {};

function loadData() {
  const dataUrl = new URL("portfolio_data.txt", window.location.href).href;
  return fetch(dataUrl)
    .then(res => {
      if (!res.ok) throw new Error(`无法加载 ${dataUrl} (HTTP ${res.status})`);
      return res.text();
    })
    .then(text => {
      DATA = JSON.parse(text);
      render();
    })
    .catch(err => {
      console.error(err);
      document.getElementById("view-company").innerHTML =
        `<p style="color:#c00;padding:20px;">数据加载失败：${err.message}<br>请确认 portfolio_data.txt 与 portfolio.html 在同一目录，并刷新重试。</p>`;
    });
}

/* 工具函数 */
function priorityLabel(priority) {
  if (priority === 1) return "P0 核心项目";
  if (priority === 2) return "P1 重点项目";
  return "P2 参与项目";
}

function projectTime(p) {
  return `${p.start} - ${p.end}`;
}

function chevronSvg() {
  return `<svg class="p-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`;
}

function renderThumb(p) {
  const imgs = p.images || [];
  if (!imgs.length) return "";
  const badge = imgs.length > 1 ? `<span class="p-thumb-count">共 ${imgs.length} 张</span>` : "";
  return `
  <div class="p-thumb" onclick="openLightbox(event, ${p.id}, 0)">
    <img src="${imgs[0]}" alt="${p.name}">
    ${badge}
  </div>`;
}

function renderDetailLink(p) {
  const detail = (p.detail || "").trim();
  if (!detail || detail === "#") return "";
  return `<a class="p-link" href="${detail}" target="_blank" rel="noopener">查看项目详情 ↗</a>`;
}

function projectCard(cp, isLast) {
  const p = DATA.projects.find(x => x.id === cp.projectId);
  const kws = p.keywords.map(k => `<span class="tag tag-keyword">${k}</span>`).join("");
  const timeRole = `${projectTime(p)} · ${cp.role}`;
  return `
  <div class="project-card open" onclick="toggleProject(event, this)">
    <div class="project-head">
      <div class="project-summary">
        <div>
          <div class="project-title-row">
            <span class="p-name">${p.name}</span>
            <span class="tag tag-priority">${priorityLabel(cp.priority)}</span>
          </div>
          <div class="p-role">${timeRole}</div>
        </div>
        <div class="p-meta-right">
          <div class="p-keywords">${kws}</div>
          ${chevronSvg()}
        </div>
      </div>
    </div>
    <div class="project-body">
      <div class="project-body-inner">
        <div class="p-fields">
          <div class="field"><div class="field-label">项目背景</div><div class="field-value">${p.background}</div></div>
          <div class="field"><div class="field-label">工作内容</div><div class="field-value">${p.responsibility}</div></div>
          <div class="field"><div class="field-label">关键成果 / 数据</div><div class="field-value result">${p.achievement}</div></div>
          ${renderDetailLink(p)}
        </div>
        ${renderThumb(p)}
      </div>
    </div>
  </div>`;
}

function renderCompany() {
  const html = DATA.companies
    .sort((a, b) => b.sort - a.sort)
    .map((c, idx, arr) => {
      const cps = DATA.companyProjects
        .filter(cp => cp.companyId === c.id)
        .sort((a, b) => a.priority - b.priority);
      const isLast = idx === arr.length - 1;
      return `
      <div class="tl-item">
        <div class="tl-left"><div class="tl-marker"></div><div class="tl-line"></div></div>
        <div class="tl-right">
          <div class="company-info">
            <div class="company-head">
              <span class="company-name">${c.name}</span>
              <span class="company-time">${c.start} - ${c.end}</span>
            </div>
            <div class="company-pos">${c.position}</div>
            <div class="company-work">${c.work}</div>
          </div>
          <div class="company-projects">${cps.map((cp, i) => projectCard(cp, i === cps.length - 1 && isLast)).join("")}</div>
        </div>
      </div>`;
    }).join("");
  document.getElementById("view-company").innerHTML = `<div class="timeline">${html}</div>`;
}

function renderProject() {
  const companies = [...DATA.companies].sort((a, b) => b.start.localeCompare(a.start));
  const items = [];
  companies.forEach((c, cIdx) => {
    if (cIdx > 0) items.push(`<div class="company-gap"></div>`);
    const cps = DATA.companyProjects
      .filter(cp => cp.companyId === c.id)
      .sort((a, b) => {
        const pa = DATA.projects.find(x => x.id === a.projectId);
        const pb = DATA.projects.find(x => x.id === b.projectId);
        return pb.start.localeCompare(pa.start);
      });
    cps.forEach((cp, pIdx) => {
      const p = DATA.projects.find(x => x.id === cp.projectId);
      const isLastInGroup = pIdx === cps.length - 1;
      const lastClass = isLastInGroup ? " last-in-group" : "";
      items.push(`
      <div class="tl-item${lastClass}">
        <div class="tl-left"><div class="tl-marker"></div><div class="tl-line"></div></div>
        <div class="tl-right">
          <div class="tl-time">${projectTime(p)}</div>
          ${projectCard(cp, false)}
        </div>
      </div>`);
    });
  });
  document.getElementById("view-project").innerHTML = `<div class="timeline project-timeline">${items.join("")}</div>`;
}

function render() {
  const per = DATA.person;
  document.getElementById("p-name").textContent = per.name;
  document.getElementById("p-job").textContent = per.job;
  document.getElementById("p-school").textContent = per.school;
  document.getElementById("p-phone").textContent = per.phone;
  document.getElementById("p-email").textContent = per.email;
  document.getElementById("p-intro").textContent = per.intro;

  const honors = per.honors || [];
  document.getElementById("p-honors").innerHTML = honors.length
    ? honors.map(h => `<span class="honor-tag">${h}</span>`).join("")
    : "";

  const skills = DATA.skills || [];
  document.getElementById("skills-grid").innerHTML = skills.length
    ? skills.map(s => `<div class="skill-card"><div class="skill-dot"></div><div class="skill-text">${s}</div></div>`).join("")
    : "";
  document.getElementById("skills-section").style.display = skills.length ? "" : "none";

  renderCompany();
  renderProject();
}

function toggleProject(e, el) {
  if (e.target.closest("a")) return;
  el.classList.toggle("open");
}

function switchDim(dim) {
  document.getElementById("tab-company").classList.toggle("active", dim === "company");
  document.getElementById("tab-project").classList.toggle("active", dim === "project");
  document.getElementById("view-company").style.display = dim === "company" ? "" : "none";
  document.getElementById("view-project").style.display = dim === "project" ? "" : "none";
  document.getElementById("section-desc").textContent = dim === "company"
    ? "按任职公司回顾工作脉络与代表项目"
    : "按时间倒序浏览全部代表项目";
}

/* ========== 图片灯箱 ========== */
let lightboxState = { projectId: null, index: 0 };

function openLightbox(event, projectId, index) {
  event.stopPropagation();
  const p = DATA.projects.find(x => x.id === projectId);
  if (!p || !p.images || !p.images.length) return;
  lightboxState = { projectId, index: Math.max(0, Math.min(index, p.images.length - 1)) };
  updateLightbox();
  document.getElementById("lightbox").classList.add("active");
  document.body.style.overflow = "hidden";
}

function closeLightbox() {
  document.getElementById("lightbox").classList.remove("active");
  document.body.style.overflow = "";
}

function updateLightbox() {
  const p = DATA.projects.find(x => x.id === lightboxState.projectId);
  if (!p) return;
  const img = p.images[lightboxState.index];
  document.getElementById("lightbox-img").src = img;
  document.getElementById("lightbox-counter").textContent = `${lightboxState.index + 1} / ${p.images.length}`;
}

function nextImage() {
  const p = DATA.projects.find(x => x.id === lightboxState.projectId);
  if (!p) return;
  lightboxState.index = (lightboxState.index + 1) % p.images.length;
  updateLightbox();
}

function prevImage() {
  const p = DATA.projects.find(x => x.id === lightboxState.projectId);
  if (!p) return;
  lightboxState.index = (lightboxState.index - 1 + p.images.length) % p.images.length;
  updateLightbox();
}

document.addEventListener("keydown", (e) => {
  const lb = document.getElementById("lightbox");
  if (!lb.classList.contains("active")) return;
  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowRight") nextImage();
  if (e.key === "ArrowLeft") prevImage();
});

loadData();
</script>
